name: Sync to projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Whole skill directories: referenced procedures and scripts are part of the
      # skill. Root-level evals/ are plugin-development tests and are not distributed.
      - 'skills/**'
      - 'agents/*.md'
      - 'rules/*.md'
      - 'hooks/**'
      - 'scripts/**'
      - 'layers/**'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: projects
        name: Build project matrix from sync config
        run: |
          python3 scripts/sync-config.py validate
          MATRIX=$(python3 scripts/sync-config.py matrix)
          test "$MATRIX" != "[]"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sync-config.json is the only project/layer registry.
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ai-dev-templates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          path: target
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync common skills
        env:
          SYNC_ADAPTERS: ${{ matrix.adapters }}
        run: |
          # Records what this run installs, so the prune step can tell an upstream
          # deletion apart from a skill the project added itself
          : > /tmp/synced-skills; : > /tmp/synced-agents; : > /tmp/synced-rules
          # Single source of truth for which skills are common, shared with /sync
          for skill in $(jq -r '.common_skills[]' skills/sync/sync-config.json); do
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "::error::common_skills lists '$skill' but skills/$skill/SKILL.md does not exist"
              exit 1
            fi
            mkdir -p "target/.claude/skills/$skill"
            case " $SYNC_ADAPTERS " in
              *" codex "*) mkdir -p "target/.agents/skills" ;;
            esac
            # Copy the whole directory: reference files and evals are part of the skill
            cp -R "skills/$skill/." "target/.claude/skills/$skill/"
            case " $SYNC_ADAPTERS " in
              *" codex "*) python3 scripts/render-codex-skill.py "skills/$skill" "target/.agents/skills/$skill" ;;
            esac
            echo "$skill" >> /tmp/synced-skills
          done

      - name: Seed portable project guidance
        run: |
          if [ ! -e target/AGENTS.md ]; then
            cp skills/init-project/templates/AGENTS.md.template target/AGENTS.md
          fi

      - name: Sync common agents
        run: |
          # Same list /sync uses, so both converge on one manifest and neither
          # prunes what the other installed
          for agent in $(jq -r '.common_agents[]' skills/sync/sync-config.json); do
            if [ ! -f "agents/$agent.md" ]; then
              echo "::error::common_agents lists '$agent' but agents/$agent.md does not exist"
              exit 1
            fi
            mkdir -p "target/.claude/agents"
            cp "agents/$agent.md" "target/.claude/agents/$agent.md"
            echo "$agent.md" >> /tmp/synced-agents
          done

      - name: Sync common rules
        run: |
          for rule in $(jq -r '.common_rules[]' skills/sync/sync-config.json); do
            if [ ! -f "rules/$rule" ]; then
              echo "::error::common_rules lists '$rule' but rules/$rule does not exist"
              exit 1
            fi
            mkdir -p "target/.claude/rules"
            cp "rules/$rule" "target/.claude/rules/$rule"
            echo "$rule" >> /tmp/synced-rules
          done

      - name: Sync layer agents
        run: |
          for LAYER in ${{ matrix.layers }}; do
            if [ -d "layers/$LAYER/agents" ]; then
              mkdir -p "target/.claude/agents"
              for agent in "layers/$LAYER/agents/"*.md; do
                [ -f "$agent" ] || continue
                cp "$agent" "target/.claude/agents/$(basename "$agent")"
                basename "$agent" >> /tmp/synced-agents
              done
            fi
          done

      - name: Sync layer rules
        run: |
          for LAYER in ${{ matrix.layers }}; do
            if [ -d "layers/$LAYER/rules" ]; then
              mkdir -p "target/.claude/rules"
              for rule in "layers/$LAYER/rules/"*.md; do
                [ -f "$rule" ] || continue
                cp "$rule" "target/.claude/rules/$(basename "$rule")"
                basename "$rule" >> /tmp/synced-rules
              done
            fi
          done

      - name: Sync layer PR template
        run: |
          for LAYER in ${{ matrix.layers }}; do
            if [ -f "layers/$LAYER/templates/pull_request_template.md" ]; then
              mkdir -p "target/.github"
              cp "layers/$LAYER/templates/pull_request_template.md" "target/.github/pull_request_template.md"
            fi
          done

      - name: Sync layer workflow templates
        run: |
          for LAYER in ${{ matrix.layers }}; do
            if [ -d "layers/$LAYER/templates" ]; then
              for tmpl in "layers/$LAYER/templates/"*.yml.template; do
                [ -f "$tmpl" ] || continue
                mkdir -p "target/.github/workflows"
                destination="target/.github/workflows/$(basename "$tmpl")"
                if [ ! -e "$destination" ]; then
                  cp "$tmpl" "$destination"
                else
                  echo "seed-only workflow preserved: $destination"
                fi
              done
            fi
          done

      - name: Report stale managed files
        working-directory: target
        run: |
          # Copying alone never removes anything, so a skill deleted upstream would
          # otherwise look current. Automated sync keeps stale entries in the manifest
          # and opens a review warning instead of deleting target content. Confirmed
          # pruning is handled by the interactive /sync workflow.
          MANIFEST=.claude/.ai-dev-synced
          if [ -f "$MANIFEST" ]; then
            for s in $(jq -r '.skills[]?' "$MANIFEST"); do
              grep -qxF "$s" /tmp/synced-skills || {
                echo "::warning::stale managed skill requires reviewed prune: $s"
                echo "$s" >> /tmp/synced-skills
              }
            done
            for a in $(jq -r '.agents[]?' "$MANIFEST"); do
              grep -qxF "$a" /tmp/synced-agents || {
                echo "::warning::stale managed agent requires reviewed prune: $a"
                echo "$a" >> /tmp/synced-agents
              }
            done
            for r in $(jq -r '.rules[]?' "$MANIFEST"); do
              grep -qxF "$r" /tmp/synced-rules || {
                echo "::warning::stale managed rule requires reviewed prune: $r"
                echo "$r" >> /tmp/synced-rules
              }
            done
          fi
          mkdir -p .claude
          to_json() { jq -R -s 'split("\n") | map(select(length > 0)) | sort | unique' "$1"; }
          jq -n \
            --argjson skills "$(to_json /tmp/synced-skills)" \
            --argjson agents "$(to_json /tmp/synced-agents)" \
            --argjson rules  "$(to_json /tmp/synced-rules)" \
            --arg adapters "${{ matrix.adapters }}" \
            '{skills: $skills, agents: $agents, rules: $rules, adapters: ($adapters | split(" "))}' > "$MANIFEST"

      - name: Configure git
        working-directory: target
        run: |
          git config user.name "rioX432"
          git config user.email "omooooori432@gmail.com"

      - name: Detect default branch
        id: default-branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          DEFAULT=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          git add -A -- .claude .github
          [ ! -e .agents ] || git add -A -- .agents
          [ ! -e AGENTS.md ] || git add -- AGENTS.md
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          DEFAULT_BRANCH="${{ steps.default-branch.outputs.branch }}"
          BRANCH="sync/ai-dev-template-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .claude/ .agents/ .github/ AGENTS.md
          git commit -m "Sync ai-dev-template common + ${{ matrix.layers }} layer files"
          git push -u origin "$BRANCH"
          FILES=$(git diff --name-only HEAD~1)
          gh pr create \
            --title "Sync ai-dev-template updates (${{ matrix.layers }})" \
            --body "## Description

          Automated sync of common + **${{ matrix.layers }}** layer files from ai-dev-templates.

          ### Updated files
          ${FILES}

          ---
          *Auto-generated by [ai-dev-templates sync](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --base "$DEFAULT_BRANCH"
