name: Sync to projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'agents/*.md'
      - 'rules/*.md'
      - 'hooks/**'
      - 'scripts/*.sh'
      - 'layers/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: CivitDeck
            layer: mobile
          - repo: live-translate
            layer: web
          - repo: vtslide
            layer: web
          - repo: KMP-FaceLink
            layer: mobile
          - repo: VocaDrip
            layer: mobile
          - repo: personal-ai-secretary
            layer: web
          - repo: kamibukuro
            layer: web
          - repo: desk-secretary-bot
            layer: iot
          - repo: kakimato
            layer: web
    steps:
      - name: Checkout ai-dev-templates
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          path: target
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync common skills
        run: |
          EXCLUDE="init-project sync"
          for skill_dir in skills/*/; do
            skill=$(basename "$skill_dir")
            echo "$EXCLUDE" | grep -qw "$skill" && continue
            if [ -f "skills/$skill/SKILL.md" ]; then
              mkdir -p "target/.claude/skills/$skill"
              cp "skills/$skill/SKILL.md" "target/.claude/skills/$skill/SKILL.md"
            fi
          done

      - name: Sync common agents
        run: |
          for agent in agents/*.md; do
            [ -f "$agent" ] || continue
            mkdir -p "target/.claude/agents"
            cp "$agent" "target/.claude/agents/$(basename "$agent")"
          done

      - name: Sync common rules
        run: |
          for rule in rules/*.md; do
            [ -f "$rule" ] || continue
            mkdir -p "target/.claude/rules"
            cp "$rule" "target/.claude/rules/$(basename "$rule")"
          done

      - name: Sync layer agents
        run: |
          LAYER="${{ matrix.layer }}"
          if [ -d "layers/$LAYER/agents" ]; then
            mkdir -p "target/.claude/agents"
            for agent in layers/$LAYER/agents/*.md; do
              [ -f "$agent" ] && cp "$agent" "target/.claude/agents/$(basename "$agent")"
            done
          fi

      - name: Sync layer rules
        run: |
          LAYER="${{ matrix.layer }}"
          if [ -d "layers/$LAYER/rules" ]; then
            mkdir -p "target/.claude/rules"
            for rule in layers/$LAYER/rules/*.md; do
              [ -f "$rule" ] && cp "$rule" "target/.claude/rules/$(basename "$rule")"
            done
          fi

      - name: Sync layer PR template
        run: |
          LAYER="${{ matrix.layer }}"
          if [ -f "layers/$LAYER/templates/pull_request_template.md" ]; then
            mkdir -p "target/.github"
            cp "layers/$LAYER/templates/pull_request_template.md" "target/.github/pull_request_template.md"
          fi

      - name: Sync layer workflow templates
        run: |
          LAYER="${{ matrix.layer }}"
          if [ -d "layers/$LAYER/templates" ]; then
            for tmpl in layers/$LAYER/templates/*.yml.template; do
              [ -f "$tmpl" ] || continue
              mkdir -p "target/.github/workflows"
              cp "$tmpl" "target/.github/workflows/$(basename "$tmpl")"
            done
          fi

      - name: Configure git
        working-directory: target
        run: |
          git config user.name "rioX432"
          git config user.email "omooooori432@gmail.com"

      - name: Detect default branch
        id: default-branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          DEFAULT=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          git add .claude/ .github/
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          DEFAULT_BRANCH="${{ steps.default-branch.outputs.branch }}"
          BRANCH="sync/ai-dev-template-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .claude/ .github/
          git commit -m "Sync ai-dev-template common + ${{ matrix.layer }} layer files"
          git push -u origin "$BRANCH"
          FILES=$(git diff --name-only HEAD~1)
          gh pr create \
            --title "Sync ai-dev-template updates (${{ matrix.layer }})" \
            --body "## Description

          Automated sync of common + **${{ matrix.layer }}** layer files from ai-dev-templates.

          ### Updated files
          ${FILES}

          ---
          *Auto-generated by [ai-dev-templates sync](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --base "$DEFAULT_BRANCH"
